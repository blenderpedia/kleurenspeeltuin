<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treinbaan">
<meta name="theme-color" content="#58c6ff">
<style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Treinbaan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
<style>
/* Layout: one full-screen 3D play field (larger than the screen, you scroll over it). Top left the menu, in the middle the stock counter, top right a bin that only shows while something is in the hand; along the bottom a drawer with tabs and one row of chunky round candy buttons. */
:root{
  --sky-top:#58c6ff; --sky-low:#dcf8ff; --grass:#74d95c;
  --ink:#2a2157; --paper:#fffdf6; --shade:rgba(42,33,87,.28);
  --red:#ff4d5a; --orange:#ff9a1f; --yellow:#ffd22e; --green:#2fc866;
  --blue:#2f9bff; --purple:#9b63ff; --pink:#ff6fc2; --brown:#a8683a;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --btn:clamp(46px,12.5vmin,76px);
  --sw:clamp(34px,9.6vmin,64px);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--sky-top),var(--sky-low) 72%);color:var(--ink);font-family:var(--display);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.bar{position:absolute;left:16px;right:16px;display:flex;gap:8px;pointer-events:none}
.bar.top{top:12px;justify-content:space-between;align-items:flex-start}
.bar.bottom{bottom:16px;justify-content:center}
.grp{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn,.sw{pointer-events:auto;flex:none;border-radius:50%;border:4px solid var(--paper);background:var(--c,var(--blue));color:var(--i,var(--paper));display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 6px 0 var(--shade);transition:transform .12s,box-shadow .12s,border-color .12s;touch-action:manipulation}
.btn{width:var(--btn);height:var(--btn)}
.sw{width:var(--sw);height:var(--sw)}
.btn:active,.sw:active{transform:translateY(4px) scale(.95);box-shadow:0 2px 0 var(--shade)}
.btn:focus-visible,.sw:focus-visible,.lab:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.btn svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn.face{background:var(--paper)}
.btn.face svg{width:80%;height:80%;stroke:none}
.btn.on,.sw.on{border-color:var(--ink);transform:translateY(-6px) scale(1.14)}
.grp.col{flex-direction:column;gap:8px}
.sw svg{width:66%;height:66%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn.big{width:calc(var(--btn)*1.25);height:calc(var(--btn)*1.25)}
.btn.ready{animation:klaar .9s ease-in-out infinite}
.hud{pointer-events:none;display:flex;align-items:center;gap:12px;height:var(--sw);padding:0 16px 0 8px;border-radius:999px;background:var(--paper);box-shadow:0 5px 0 var(--shade);font:800 clamp(20px,5.6vmin,30px)/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.hud span{display:flex;align-items:center;gap:5px;height:100%}
.hud svg{height:74%;width:auto}
.hud .pop{animation:klaar .35s ease-out}
.hud.no{animation:nee .3s linear}
@keyframes nee{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.btn{position:relative}
.cost{position:absolute;right:-6px;bottom:-6px;min-width:1.6em;height:1.6em;box-sizing:border-box;padding:0 .3em;border-radius:1em;border:2px solid var(--paper);background:var(--brown);color:var(--paper);font:800 clamp(13px,3.2vmin,17px)/1 var(--display);display:grid;place-items:center;pointer-events:none}
.cost.st{background:#7f8aa0}
.cost.two{right:auto;left:-6px}
.btn.poor{filter:grayscale(.9);opacity:.55}
.btn.bin{animation:klaar .9s ease-in-out infinite;pointer-events:none}
.btn.bin.hot{animation:none;transform:scale(1.4);border-color:var(--ink)}
@keyframes klaar{50%{transform:scale(1.18)}}
/* the drawer at the bottom: tabs with a word under them, the buttons of the open tab on one row; wide screens side by side, narrow screens the tabs on top */
#treinBar{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:8px 12px 10px;border-radius:28px;background:rgba(255,253,246,.94);box-shadow:0 6px 0 var(--shade);box-sizing:border-box;max-width:100%}
#treinBar.two{flex-direction:column;gap:6px}
.tabs{display:flex;gap:3px;padding:3px;border-radius:21px;background:rgba(42,33,87,.07);flex:none}
.tab{display:grid;justify-items:center;align-content:center;gap:2px;min-width:var(--tw,58px);padding:5px 5px 4px;border:0;border-radius:18px;background:none;color:var(--ink);font:800 var(--tf,14px)/1 var(--display);cursor:pointer;touch-action:manipulation}
.tab svg{width:var(--ti,24px);height:var(--ti,24px);fill:none;stroke:var(--k);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.tab span{opacity:.72}
.tab.on{background:var(--c);color:var(--i,var(--paper));box-shadow:0 3px 0 var(--shade)}
.tab.on svg{stroke:currentColor}
.tab.on span{opacity:1}
.tab:focus-visible{outline:4px solid var(--ink);outline-offset:2px}
.items{display:flex;justify-content:center;padding:7px 0 3px}
.row{display:flex;gap:8px;align-items:center}
.sep{width:6px;flex:none}
/* driving a machine: a joystick bottom left, the work button and the get-out button bottom right; the drawer is away meanwhile */
#rij{--st:clamp(124px,34vmin,184px);position:absolute;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#stick{pointer-events:auto;position:relative;flex:none;width:var(--st);height:var(--st);border-radius:50%;background:rgba(255,253,246,.82);border:4px solid var(--paper);box-shadow:0 6px 0 var(--shade);touch-action:none;cursor:grab}
#stick::before{content:"";position:absolute;inset:16%;border-radius:50%;border:3px dashed rgba(42,33,87,.18)}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;margin:-22% 0 0 -22%;border-radius:50%;background:var(--kc,var(--yellow));border:4px solid var(--paper);box-shadow:0 4px 0 var(--shade);pointer-events:none;box-sizing:border-box}
.rjr{display:flex;flex-direction:column;align-items:center;gap:14px}
.rjr .btn{pointer-events:auto}
#rij-doe{width:calc(var(--btn)*1.45);height:calc(var(--btn)*1.45)}
#rij-doe.busy{animation:klaar .9s ease-in-out infinite}
/* the bin top right: only there while something is in the hand */
#bin{visibility:hidden;opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s,visibility 0s .15s;pointer-events:none}
#bin.show{visibility:visible;opacity:1;transform:none;transition:opacity .15s,transform .15s}
#bin.show.hot{transform:scale(1.4)}

/* the start screen: two big cards to choose how to play */
#start{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(88,198,255,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);overflow:auto}
#start .in{display:grid;justify-items:center;gap:clamp(12px,3.4vmin,26px);max-width:100%}
#start h1{margin:0;font:800 clamp(34px,10vmin,68px)/1 var(--display);color:var(--paper);text-shadow:0 5px 0 var(--shade);letter-spacing:.01em}
.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(12px,3.4vmin,26px)}
.mode{display:grid;justify-items:center;align-content:start;gap:4px;width:clamp(138px,40vmin,236px);padding:clamp(12px,3vmin,22px) 12px clamp(14px,3.4vmin,24px);border:5px solid var(--paper);border-radius:30px;background:var(--paper);color:var(--ink);font-family:var(--display);cursor:pointer;box-shadow:0 8px 0 var(--shade);transition:transform .12s,box-shadow .12s,border-color .12s;touch-action:manipulation}
.mode:hover{border-color:var(--yellow)}
.mode:active{transform:translateY(5px) scale(.97);box-shadow:0 3px 0 var(--shade)}
.mode:focus-visible,.go:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.mode svg{width:clamp(74px,22vmin,128px);height:auto}
.mode b{font:800 clamp(22px,6vmin,34px)/1.1 var(--display)}
.mode span{font:700 clamp(13px,3.3vmin,17px)/1.25 var(--display);text-align:center;opacity:.8;max-width:11em}
.go{padding:.5em 1.3em;border:4px solid var(--paper);border-radius:999px;background:var(--orange);color:var(--paper);font:800 clamp(18px,4.6vmin,24px)/1 var(--display);cursor:pointer;box-shadow:0 6px 0 var(--shade);touch-action:manipulation}
.go:active,.pill:active{transform:translateY(4px);box-shadow:0 2px 0 var(--shade)}
.opts{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 12px}
.pill{display:inline-flex;align-items:center;gap:.35em;padding:.42em 1em .42em .75em;border:4px solid var(--paper);border-radius:999px;background:var(--paper);color:var(--ink);font:800 clamp(15px,3.8vmin,19px)/1 var(--display);cursor:pointer;box-shadow:0 5px 0 var(--shade);touch-action:manipulation}
.pill svg{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.pill:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
/* creative: no stock, no prices, no buildings */
body.vrij #hud,body.vrij .cost,body.vrij #tab-huis{display:none}
@media (prefers-reduced-motion:reduce){.mode,.go{transition:none}}
#fail{position:absolute;inset:0;margin:0;display:grid;place-items:center;padding:24px;text-align:center;font:700 20px/1.4 var(--display);background:var(--paper);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.btn.ready,.btn.bin{animation:none}.btn,.sw{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Speelmat"></canvas>
  <div class="bar top"><div class="grp" id="tl"></div>
    <div class="hud" id="hud" role="status" aria-label="Voorraad bij de fabriek: hout en steen"><span id="hudH"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.500 12 5l9 4.500v7L12 21l-9-4.500z" fill="#a8683a"/><path d="M3 9.500 12 14l9-4.500L12 5z" fill="#c98a55"/><path d="M12 14v7" stroke="#7a4a26" stroke-width="1.200"/></svg><b>20</b></span><span id="hudS"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.500 12 5l9 4.500v7L12 21l-9-4.500z" fill="#8791a6"/><path d="M3 9.500 12 14l9-4.500L12 5z" fill="#b4bccb"/><path d="M12 14v7" stroke="#5f6980" stroke-width="1.200"/></svg><b>0</b></span></div>
    <div class="grp" id="tr"></div></div>
  <div class="bar bottom" id="bot"></div>
  <div id="rij" hidden><div id="stick" role="application" aria-label="Stuur: duw de knop de kant op waar je heen wilt"><div id="knob"></div></div>
    <div class="rjr"><button type="button" class="btn" id="rij-uit"></button><button type="button" class="btn" id="rij-doe"></button></div></div>
  <div id="start"><div class="in">
    <h1>Treinbaan</h1>
    <div class="modes">
      <button type="button" class="mode" id="start-vrij"><svg viewBox="0 0 64 48" aria-hidden="true"><rect x="5" y="25" width="19" height="19" rx="3" fill="#ff4d5a"/><rect x="25" y="25" width="19" height="19" rx="3" fill="#2f9bff"/><rect x="15" y="5" width="19" height="19" rx="3" fill="#ffd22e"/><path d="M46 44V30a8 8 0 0 1 16 0v14h-5V31a3 3 0 0 0-6 0v13z" fill="#9b63ff"/><path d="m47 6 2 4.500 4.800.500-3.600 3.300 1 4.700-4.200-2.400-4.200 2.400 1-4.700-3.600-3.300 4.800-.500z" fill="#ff9a1f"/></svg><b>Creatief</b><span>Lege wereld, alles gratis</span></button>
      <button type="button" class="mode" id="start-camp"><svg viewBox="0 0 64 48" aria-hidden="true"><path d="M16 4 5 20h5L3 31h10v8h6v-8h10l-7-11h5z" fill="#2f9e5b"/><rect x="13" y="38" width="6" height="6" fill="#a8683a"/><path d="M35 28 44 23.500l9 4.500v9L44 41.500 35 37z" fill="#a8683a"/><path d="M35 28l9 4.500 9-4.500-9-4.500z" fill="#c98a55"/><path d="M47 13 54 9.500l7 3.500v7L54 23.500 47 20z" fill="#8791a6"/><path d="M47 13l7 3.500 7-3.500-7-3.500z" fill="#b4bccb"/><rect x="3" y="43" width="58" height="3" rx="1.500" fill="#f2c078"/></svg><b>Campagne</b><span>Hak hout en steen en verdien je rails</span></button>
    </div>
    <div class="opts">
      <button type="button" class="go" id="start-door" hidden>Verder spelen</button>
      <button type="button" class="pill" id="start-again" hidden></button>
      <button type="button" class="pill" id="start-sound"></button>
      <button type="button" class="pill" id="start-full" hidden></button>
    </div>
  </div></div>
  <p id="fail" hidden>Dit spel heeft 3D nodig. Open het in een nieuwere browser.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const app=$('#app'), canvas=$('#c');
const T=window.THREE;
let renderer=null;
if(T){ try{ renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true}); }catch(e){ renderer=null; } }
if(!renderer){ $('#fail').hidden=false; return; }

const V3=T.Vector3, YAX=new V3(0,1,0), PI=Math.PI;
const R=(a,b)=>a+Math.random()*(b-a);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, AMP=reduce?0:1;
const C={red:0xff4d5a,orange:0xff9a1f,yellow:0xffd22e,green:0x2fc866,blue:0x2f9bff,purple:0x9b63ff,pink:0xff6fc2,brown:0xa8683a,ink:0x2a2157,paper:0xfffdf6,grass:0x74d95c,wood:0xf2c078};
const RAINBOW=[C.red,C.orange,C.yellow,C.green,C.blue,C.purple];
const hx=c=>'#'+c.toString(16).padStart(6,'0');

/* ---------- geometry + material helpers ---------- */
const mat=(c,o)=>new T.MeshPhongMaterial(Object.assign({color:c,shininess:40,specular:0x222222},o||{}));
const sph=(r,w=20,h=14)=>new T.SphereGeometry(r,w,h);
const cyl=(a,b,h,s=20)=>new T.CylinderGeometry(a,b,h,s);
const cone=(r,h,s=20)=>new T.ConeGeometry(r,h,s);
const box=(w,h,d)=>new T.BoxGeometry(w,h,d);
const torus=(Rr,r,arc=PI*2,ts=10,rs=32)=>new T.TorusGeometry(Rr,r,ts,rs,arc);
function mesh(geo,m,x=0,y=0,z=0,parent){ const o=new T.Mesh(geo,m); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; if(parent) parent.add(o); return o; }
function rrShape(w,h,r){ const s=new T.Shape(),x=-w/2,y=-h/2; s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h); s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }
function roundBox(w,h,d,r=.12,b=.06){ const g=new T.ExtrudeGeometry(rrShape(w-2*b,h-2*b,r),{depth:d-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:6}); g.translate(0,0,-(d-2*b)/2); return g; }
function pyramid(r,h){ const g=new T.ConeGeometry(r,h,4).toNonIndexed(); g.rotateY(PI/4); g.computeVertexNormals(); return g; }
function starGeo(Ro=.55,ri=.25,d=.16){ const s=new T.Shape(); for(let i=0;i<10;i++){ const a=i/10*PI*2+PI/2,q=i%2?ri:Ro,x=Math.cos(a)*q,y=Math.sin(a)*q; if(i) s.lineTo(x,y); else s.moveTo(x,y); } s.closePath(); const g=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:2}); g.center(); return g; }
function canvasTex(draw,rx=1,ry=1){ const c=document.createElement('canvas'); c.width=c.height=256; draw(c.getContext('2d')); const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx,ry); return t; }

/* ---------- tweens + timers ---------- */
const ease={ lin:k=>k, out:k=>1-Math.pow(1-k,3), inOut:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,
  back:k=>{const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);},
  bounce:k=>{const n=7.5625,d=2.75; if(k<1/d)return n*k*k; if(k<2/d)return n*(k-=1.5/d)*k+.75; if(k<2.5/d)return n*(k-=2.25/d)*k+.9375; return n*(k-=2.625/d)*k+.984375;} };
let tweens=[], timers=[], Tm=0;
function tw(dur,fn,e,done){ tweens.push({t:0,dur,fn,e:e||ease.out,done}); }
function after(sec,fn){ timers.push({t:sec,fn}); }
function stepAnim(dt){
  for(const a of tweens.slice()){ a.t+=dt; const k=Math.min(1,a.t/a.dur); a.fn(a.e(k),k); if(k>=1){ a.dead=true; if(a.done) a.done(); } }
  tweens=tweens.filter(a=>!a.dead);
  for(const a of timers.slice()){ a.t-=dt; if(a.t<=0){ a.dead=true; a.fn(); } }
  timers=timers.filter(a=>!a.dead);
}
function pop(o,amp=.22,dur=.32){ const s=o.userData.s0||(o.userData.s0=o.scale.clone()); tw(dur,(e,k)=>{ o.scale.copy(s).multiplyScalar(1+amp*Math.sin(k*PI)); },ease.lin); }
function popIn(o,dur=.4){ const s=o.userData.s0||(o.userData.s0=o.scale.clone()); tw(dur,e=>{ o.scale.copy(s).multiplyScalar(Math.max(.001,e)); },ease.back); }

/* ---------- sound ---------- */
let actx=null, muted=false;
try{ muted=localStorage.getItem('treinbaan-stil')==='1'; }catch(e){}
function audio(){ if(!actx){ const A=window.AudioContext||window.webkitAudioContext; if(A){ try{ actx=new A(); }catch(e){} } } if(actx&&actx.state==='suspended'){ const p=actx.resume(); if(p&&p.catch) p.catch(()=>{}); } return actx; }
function tone(f,dur=.15,type='sine',vol=.2,f2=0,delay=0){
  if(muted) return; const a=audio(); if(!a) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const NOTE=[262,294,330,349,392,440,494,523,587,659];
const sfx={
  pop:i=>{ const n=NOTE[(i||0)%NOTE.length]; tone(n*2,.12,'triangle',.2,n*3); },
  note:i=>tone(NOTE[(i||0)%NOTE.length],.35,'triangle',.24),
  plop:()=>tone(220,.16,'sine',.3,90),
  boing:()=>tone(180,.3,'sine',.25,430),
  boop:()=>tone(300,.14,'sine',.18,240),
  tap:()=>tone(520,.08,'sine',.15,720),
  tada:()=>[0,2,4,7].forEach((n,i)=>tone(NOTE[n]*2,.42,'triangle',.2,0,i*.11)),
  crash:()=>{ for(let i=0;i<6;i++) tone(R(120,320),.25,'square',.05,60,i*.04); }
};

/* ---------- world ---------- */
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(35,1,.1,300);
scene.add(new T.HemisphereLight(0xffffff,0xdcf3d2,.66));
const sunL=new T.DirectionalLight(0xffffff,.5); sunL.position.set(7,14,9); sunL.castShadow=true;
sunL.shadow.mapSize.set(1024,1024); sunL.shadow.bias=-.0006; sunL.shadow.normalBias=.03; sunL.shadow.radius=3;
{ const s=sunL.shadow.camera; s.left=s.bottom=-18; s.right=s.top=18; s.near=1; s.far=50; }
scene.add(sunL); scene.add(sunL.target);
const ground=new T.Mesh(new T.SphereGeometry(600,96,48),new T.MeshLambertMaterial({color:C.grass})); ground.position.y=-600; ground.receiveShadow=true; scene.add(ground);

/* the sky (sun and clouds) travels along when the picture scrolls; the meadow around the play field stays where it is */
const decor=new T.Group(); scene.add(decor); const sky=new T.Group(); scene.add(sky);
const sunG=new T.Group(); sunG.position.set(-5,13,-24); sky.add(sunG);

const conf=[], confGeo=box(.17,.17,.04), basicCache={};

let confI=0;
function burst(p,n=24,power=5,color){ for(let i=0;i<n;i++){ const c=conf[confI++%conf.length]; c.m.visible=true; c.m.position.copy(p); c.m.material=basic(color!=null?color:confCols[(Math.random()*confCols.length)|0]); c.v.set(R(-.5,.5)*power,R(.4,1.5)*power,R(-.5,.5)*power); c.w.set(R(-9,9),R(-9,9),R(-9,9)); c.life=R(1.2,2); c.m.userData.s=R(.8,1.6); c.m.scale.setScalar(c.m.userData.s); } }

const BLOK=(()=>{
  const PH=window.CANNON, HALF=.47, RH=.82, V=(x,y,z)=>new PH.Vec3(x,y,z);

  const geos={ kubus:roundBox(.94,.94,.94,.1,.05), cilinder:cyl(HALF,HALF,.94,28),

    boog:(()=>{ const s=new T.Shape(); s.moveTo(-.42,-.42); s.lineTo(-.24,-.42); s.absarc(0,-.42,.24,PI,0,true); s.lineTo(.42,-.42); s.lineTo(.42,.42); s.lineTo(-.42,.42); s.closePath(); return fit(ext(s),.94,.94); })(),

    /* a tunnel, open along z: a gate at each end, two walls with a window (so you can see the train go through) and a flat roof to build on */
    tunnel:(()=>{ const P=[], Nn=[], put=q=>{ const n=q.index?q.toNonIndexed():q, a=n.attributes.position.array, b=n.attributes.normal.array; for(let i=0;i<a.length;i++){ P.push(a[i]); Nn.push(b[i]); } };
      const s=new T.Shape(); s.moveTo(-.92,.03); s.lineTo(-.62,.03); s.lineTo(-.62,.45); s.absarc(0,.45,.62,PI,0,true); s.lineTo(.62,.03); s.lineTo(.92,.03); s.lineTo(.92,1.37); s.lineTo(-.92,1.37); s.closePath();
      [-.9,.68].forEach(z=>{ const q=new T.ExtrudeGeometry(s,{depth:.16,bevelEnabled:true,bevelThickness:.03,bevelSize:.03,bevelSegments:2,curveSegments:14}); q.translate(0,0,z+.03); put(q); });
      const w=new T.Shape(); w.moveTo(-.69,0); w.lineTo(.69,0); w.lineTo(.69,1.4); w.lineTo(-.69,1.4); w.closePath(); const h=new T.Path(); h.moveTo(-.42,.32); h.lineTo(-.42,.62); h.absarc(0,.62,.42,PI,0,true); h.lineTo(.42,.32); h.closePath(); w.holes.push(h);
      [-1,1].forEach(sd=>{ const q=new T.ExtrudeGeometry(w,{depth:.28,bevelEnabled:false,curveSegments:12}); q.translate(0,0,-.14); q.rotateY(PI/2); q.translate(sd*.8,0,0); put(q); });
      const r=box(1.34,.3,1.38); r.translate(0,1.25,0); put(r);

  const cylQ=PH?new PH.Quaternion():null; if(cylQ) cylQ.setFromAxisAngle(V(1,0,0),-PI/2);
  const shapes={
    kubus:b=>b.addShape(new PH.Box(V(HALF,HALF,HALF))),

    boog:b=>{ b.addShape(new PH.Box(V(.47,.335,.47)),V(0,.135,0)); [-1,1].forEach(s=>b.addShape(new PH.Box(V(.115,.135,.47)),V(s*.355,-.335,0))); },

/* ---------- wooden railway: track pieces and little trains ---------- */
const SPOOR=(()=>{
  /* every piece starts at its end A (the origin) heading along +x; a bend turns left, a bridge piece climbs one level in a gentle S, a switch runs straight on and also branches off to the left (mirrored: to the right) */
  const RR=2, TH=.16, HW=.45, RISE=1.1, BL=4, ARCH=.72, N=24;
  const wood=mat(C.wood,{shininess:14,specular:0x111111}), beech=mat(0xe2ab66,{shininess:10,specular:0x0c0c0c}), grv=new T.MeshLambertMaterial({color:0xc48a47}), ink=mat(C.ink), yel=mat(C.yellow), glass=mat(0xbfe6ff), red=mat(C.red,{shininess:60}), tar=mat(0x687189,{shininess:12,specular:0x111111}), white=new T.MeshLambertMaterial({color:C.paper});
  const knopM=mat(0x2fc866,{shininess:60});
  const stoneM=mat(0xa3abbd,{shininess:10,specular:0x111111}), capM=mat(0x7f8aa0,{shininess:10,specular:0x111111}), mouthM=new T.MeshBasicMaterial({color:0x221a44});
  const dash=(a0,a1)=>{ const s=new T.Shape(); s.absarc(0,RR,RR+.04,-PI/2+a0,-PI/2+a1,false); s.absarc(0,RR,RR-.04,-PI/2+a1,-PI/2+a0,true); s.closePath(); return s; };
  const rise=x=>{ const u=Math.max(0,Math.min(1,x/BL)); return RISE*u*u*(3-2*u); };
  const lay=q=>{ q.rotateX(-PI/2); return q; };
  const arc=(r0,r1)=>{ const s=new T.Shape(), e=.012; s.absarc(0,RR,r1,-PI/2+e,-e,false); s.absarc(0,RR,r0,-e,-PI/2+e,true); s.closePath(); return s; };
  const side=pts=>{ const s=new T.Shape(); pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); s.closePath(); return s; };
  const slab=(s,d)=>{ const q=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}); q.translate(0,0,-d/2); return q; };
  const round=(cx,cy,a0,a1)=>{ const o=[]; for(let i=0;i<=6;i++){ const a=a0+(a1-a0)*i/6; o.push([cx+Math.cos(a)*.3,cy+Math.sin(a)*.3]); } return o; };
  const along=(x0,x1,dy)=>{ const o=[]; for(let i=0;i<=N;i++){ const x=x0+(x1-x0)*i/N; o.push([x,rise(x)+dy]); } return o; };
  const frameAt=x=>{ const s=new T.Shape(); s.moveTo(-.86,0); s.lineTo(-.54,0); s.lineTo(-.54,.5); s.absarc(0,.5,.54,PI,0,true); s.lineTo(.54,0); s.lineTo(.86,0); s.lineTo(.86,1.2); s.lineTo(-.86,1.2); s.closePath();
      const q=new T.ExtrudeGeometry(s,{depth:.16,bevelEnabled:true,bevelThickness:.03,bevelSize:.03,bevelSegments:2,curveSegments:16}); q.rotateY(-PI/2); q.translate(x,0,0); return q; };
  const mouthAt=x=>{ const s=new T.Shape(); s.moveTo(-.54,0); s.lineTo(-.54,.5); s.absarc(0,.5,.54,PI,0,true); s.lineTo(.54,0); s.closePath(); const q=new T.ShapeGeometry(s,16); q.rotateY(-PI/2); q.translate(x,0,0); return q; };
  const geo={
    recht:(()=>{ const q=lay(roundBox(1.97,2*HW,TH,.08,.025)); q.translate(1,TH/2,0); return q; })(),
    bocht:(()=>{ const q=lay(new T.ExtrudeGeometry(arc(RR-HW+.025,RR+HW-.025),{depth:TH-.05,bevelEnabled:true,bevelThickness:.025,bevelSize:.025,bevelSegments:2,curveSegments:18})); q.translate(0,.025,0); return q; })(),
    brug:slab(side(along(.015,BL-.015,TH).concat(along(BL-.015,.015,0))),2*HW),
    /* what the bridge stands on: solid wood under the slope, and half an arch at the high end */
    romp:slab(side([[.5,0],[BL-ARCH,0]].concat(round(BL-ARCH+.3,RISE-.42,PI,PI/2),[[BL-.015,RISE-.12]],along(BL-.015,.5,-.004))),.84),
    /* under a high straight piece: a pillar that opens into half an arch on both sides, so two neighbours make a whole arch over their joint */
    pijler:slab(side([[ARCH,-RISE],[2-ARCH,-RISE]].concat(round(2-ARCH+.3,-.42,PI,PI/2),[[1.985,-.12],[1.985,0],[.015,0],[.015,-.12]],round(ARCH-.3,-.42,PI/2,0))),.84),
    zuil:roundBox(.56,RISE,.84,.12,.04),
    gRecht:box(1.97,.012,.1), gBrug:slab(side(along(.015,BL-.015,TH+.003).concat(along(BL-.015,.015,TH+.015))),.1),
    gBocht:[-.24,.24].map(o=>{ const q=lay(new T.ShapeGeometry(arc(RR+o-.05,RR+o+.05),18)); q.translate(0,TH+.006,0); return q; }),
    /* the pointer on a switch: it lies on the wood and shows which way the next train goes */
    pijl:lay(new T.ExtrudeGeometry(side([[0,-.07],[.36,-.07],[.36,-.18],[.66,0],[.36,.18],[.36,.07],[0,.07]]),{depth:.02,bevelEnabled:false})),
    /* road: the white stripes down the middle, and for a level crossing the two bits of road beside the rails, the plates between them and the booms */
    streep:box(.36,.012,.08), strepen:[.1,.42,.74].map(f=>{ const q=lay(new T.ShapeGeometry(dash(f*PI/2,(f+.16)*PI/2),6)); q.translate(0,TH+.006,0); return q; }),
    oprit:roundBox(.9,TH,.56,.06,.025), plaatM:box(.9,.01,.37), plaatZ:box(.9,.01,.15), paal:cyl(.055,.07,.5,10), kap:sph(.085,10,8), boom:box(.28,.075,.075), gewicht:roundBox(.2,.16,.14,.04,.02),
    /* a tunnel gate in the side of the high ground: a stone frame round an arch, dark inside. Its back rests against the hill at x 1.58 (the rim lies .42 beyond the outer dots) */
    poort:frameAt(1.58), mond:mouthAt(1.566),
    /* a road gate: the same frame, but the road runs between the dots, so it starts a dot further out and the rim lies at .58 */
    wpoort:frameAt(.58), wmond:mouthAt(.566),
    poortKap:roundBox(.3,.14,1.96,.05,.02),
    /* an end of the line: a red beam with white bands across the rails on two posts, two round buffers facing the train; just behind it a yellow box with a big green button (there no train stands in front of it) */
    juk:roundBox(.16,.22,1.04,.05,.02), jukBand:box(.17,.23,.13), jukPaal:roundBox(.12,.4,.12,.03,.015), buffer:(()=>{ const q=cyl(.085,.085,.08,16); q.rotateZ(PI/2); return q; })(), bufStang:(()=>{ const q=cyl(.035,.035,.12,8); q.rotateZ(PI/2); return q; })(),
    knopVoet:roundBox(.4,.22,.4,.08,.03), knop:cyl(.14,.15,.1,18)
  };
  const LENB=(()=>{ let l=0; for(let i=0;i<64;i++){ const a=BL*i/64, b=BL*(i+1)/64; l+=Math.hypot(b-a,rise(b)-rise(a)); } return l; })();
  /* a way through a piece: where you are after a share u of it, and how long it is */
  const SEG={
    line:{len:2,at:(u,o)=>o.set(2*u,0,0)},
    arc:{len:PI*RR/2,at:(u,o)=>{ const a=u*PI/2; return o.set(RR*Math.sin(a),0,-RR*(1-Math.cos(a))); }},
    ramp:{len:LENB,at:(u,o)=>o.set(BL*u,rise(BL*u),0)},
    cross:{len:2,at:(u,o)=>o.set(1,0,2*u-1)},
    kort:{len:1.7,at:(u,o)=>o.set(1.7*u,0,0)}
  };
  /* a sort of piece: its ends [x, levels up, z, quarter turns of the way out] and the ways through it [shape, from end, to end] */
  const mk=(net,ends,segs,o)=>{ const t=Object.assign({net,ends:ends.map(e=>({x:e[0],l:e[1],z:e[2],oq:e[3],net:e[4]||net})),segs:segs.map(s=>({at:SEG[s[0]].at,len:SEG[s[0]].len,a:s[1],b:s[2],net:s[3]||net,n:s[0]==='ramp'?19:9}))},o||{});
    t.endSegs=t.ends.map((e,k)=>t.segs.map((s,i)=>s.a===k||s.b===k?i:-1).filter(i=>i>=0)); t.multi=t.endSegs.some(l=>l.length>1); return t; };
  const TYPE={
    recht:mk('rail',[[0,0,0,2],[2,0,0,0]],[['line',0,1]],{sym:true}),
    bocht:mk('rail',[[0,0,0,2],[RR,0,-RR,1]],[['arc',0,1]]),
    brug:mk('rail',[[0,0,0,2],[BL,1,0,0]],[['ramp',0,1]]),
    wissel:mk('rail',[[0,0,0,2],[2,0,0,0],[RR,0,-RR,1]],[['line',0,1],['arc',0,2]],{flat:true,mirror:true}),
    /* road pieces lie between the dots of the mat, so that a level crossing (rails one way, road across) fits both */
    weg:mk('road',[[0,0,0,2],[2,0,0,0]],[['line',0,1]],{flat:true,sym:true}),
    wbocht:mk('road',[[0,0,0,2],[RR,0,-RR,1]],[['arc',0,1]],{flat:true}),
    overweg:mk('rail',[[0,0,0,2],[2,0,0,0],[1,0,-1,1,'road'],[1,0,1,3,'road']],[['line',0,1],['cross',2,3,'road']],{flat:true,sym:true}),
    /* a tunnel gate: a short straight from the dot outside the high ground into its side (berg: it may go in there) */
    poort:mk('rail',[[0,0,0,2],[2,0,0,0]],[['line',0,1]],{flat:true,berg:true}),
    /* the end of the line: rails that stop at a buffer 1.7 along; that end (net 'eind') joins nothing */
    eind:mk('rail',[[0,0,0,2],[1.7,0,0,0,'eind']],[['kort',0,1]],{flat:true}),
    /* a car tunnel gate: a short straight road from the dot outside the high ground into its side */
    wpoort:mk('road',[[0,0,0,2],[2,0,0,0]],[['line',0,1]],{flat:true,berg:true})
  };
  const flatM=(q,m,x,y,z,p)=>{ const o=mesh(q,m,x,y,z,p); o.castShadow=false; return o; };
  function piece(type){ const g=new T.Group(); let pier=null, arm=null, gates=null;
    if(type==='weg'||type==='wpoort'){ mesh(geo.recht,tar,0,0,0,g); [.36,1,1.64].forEach(x=>flatM(geo.streep,white,x,TH+.004,0,g)); }
    if(type==='wbocht'){ mesh(geo.bocht,tar,0,0,0,g); geo.strepen.forEach(q=>flatM(q,white,0,0,0,g)); }
    if(type==='overweg'){ [-1,1].forEach(s=>{ mesh(geo.oprit,tar,1,TH/2,s*.725,g); flatM(geo.plaatZ,tar,1,TH+.004,s*.37,g); }); flatM(geo.plaatM,tar,1,TH+.004,0,g);
      /* a boom on each side; it swings about the post it hangs on */
      gates=[-1,1].map(s=>{ const h=new T.Group(); h.position.set(1-s*.62,0,s*.74); if(s<0) h.rotation.y=PI; mesh(geo.paal,ink,0,.25,0,h); mesh(geo.kap,red,0,.56,0,h);
        const b=new T.Group(); b.position.set(0,.44,0); for(let i=0;i<4;i++) mesh(geo.boom,i&1?white:red,.08+.14+i*.28,0,0,b); mesh(geo.gewicht,ink,-.14,0,0,b); b.rotation.z=1.36; h.add(b); g.add(h); return b; }); }
    if(type==='recht'||type==='wissel'||type==='overweg'||type==='poort'||type==='eind'){ mesh(geo.recht,wood,0,0,0,g); [-1,1].forEach(s=>flatM(geo.gRecht,grv,1,TH+.004,s*.24,g)); }
    if(type==='poort'){ mesh(geo.poort,stoneM,0,0,0,g); mesh(geo.poortKap,capM,1.47,1.25,0,g); g.add(new T.Mesh(geo.mond,mouthM)); }
    if(type==='eind'){ const j=new T.Group(); j.position.set(1.87,TH,0); mesh(geo.juk,red,0,.24,0,j); [-.3,.3].forEach(z=>{ mesh(geo.jukBand,white,0,.24,z,j); mesh(geo.jukPaal,ink,.04,.2,z*1.1,j); });
      [-.25,.25].forEach(z=>{ mesh(geo.bufStang,ink,-.12,.22,z,j); mesh(geo.buffer,ink,-.15,.22,z,j); }); g.add(j);
      mesh(geo.knopVoet,yel,2.25,.11,0,g); const knob=mesh(geo.knop,knopM,2.25,.27,0,g); g.userData.knob=knob; g.userData.juk=j; }
    if(type==='wpoort'){ mesh(geo.wpoort,stoneM,0,0,0,g); mesh(geo.poortKap,capM,.47,1.25,0,g); g.add(new T.Mesh(geo.wmond,mouthM)); }

    driveUI=(on,sort)=>{ rij.hidden=!on; bot.hidden=on; if(on){ const v=MSV[sort]; stk.style.setProperty('--kc',v[0]); doe.style.setProperty('--c',v[0]); doe.style.setProperty('--i',v[3]); doe.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ST[v[1]]+'</svg>'; doe.setAttribute('aria-label',v[2]); doe.title=v[2]; } knob.style.transform=''; applyCamera(); };
    const mv=e=>{ const r=stk.getBoundingClientRect(), R=r.width/2; let x=(e.clientX-r.left-R)/(R*.7), y=(e.clientY-r.top-R)/(R*.7); const l=Math.hypot(x,y); if(l>1){ x/=l; y/=l; } knob.style.transform='translate('+(x*R*.56)+'px,'+(y*R*.56)+'px)'; trein.stick(x,y); };
    stk.addEventListener('pointerdown',e=>{ audio(); sid=e.pointerId; try{ stk.setPointerCapture(sid); }catch(err){} mv(e); });
    stk.addEventListener('pointermove',e=>{ if(e.pointerId===sid) mv(e); });
    ['pointerup','pointercancel','lostpointercapture'].forEach(n=>stk.addEventListener(n,e=>{ if(e.pointerId!==sid) return; sid=null; knob.style.transform=''; trein.stick(0,0); }));
    busyUI=on=>doe.classList.toggle('busy',on);
    doe.addEventListener('click',()=>{ audio(); trein.act(); }); uit.addEventListener('click',()=>{ audio(); trein.leave(); }); }
  /* Blokken */
  [['kubus','var(--red)','Blok'],['cilinder','var(--blue)','Rol'],['dak','var(--orange)','Dak'],['boog','var(--purple)','Boog'],['plat','var(--green)','Plat dak'],['tunnel','var(--pink)','Tunnelblok: past over rails of weg']].forEach(([k,c,l])=>{ bs.push(mkBtn(G.blok,{id:'tblok-'+k,icon:ST[k]?null:k,svg:ST[k],c,label:l,on:b=>{ trein.setShape(k); choose(bs,b); }})); }); bs[0].classList.add('on'); }

/* ---------- input ---------- */
const downs=new Set();
canvas.addEventListener('pointerdown',ev=>{ audio(); downs.add(ev.pointerId); try{ canvas.setPointerCapture(ev.pointerId); }catch(e){} trein.down(ev); });
canvas.addEventListener('pointermove',ev=>{ if(downs.has(ev.pointerId)) trein.move(ev); });
['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,ev=>{ downs.delete(ev.pointerId); trein.up(ev); }));
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{ e.preventDefault(); const k=e.deltaMode===1?30:1; trein.wheel((e.shiftKey?e.deltaY:e.deltaX)*k,(e.shiftKey?0:e.deltaY)*k); },{passive:false});
/* the arrow keys scroll the picture; in a machine they (and W A S D) steer it, the space bar does the work and Escape gets you out */
const keys=new Set(), KEY={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',a:'l',d:'r',w:'u',s:'d',A:'l',D:'r',W:'u',S:'d'};
const keyStick=()=>{ const x=(keys.has('r')?1:0)-(keys.has('l')?1:0), y=(keys.has('d')?1:0)-(keys.has('u')?1:0), l=Math.hypot(x,y)||1; trein.stick(x/l,y/l); };
window.addEventListener('keydown',e=>{ if(trein.driving&&$('#start').hidden){ const k=KEY[e.key]; if(k){ e.preventDefault(); keys.add(k); keyStick(); return; } if(e.key===' '){ e.preventDefault(); if(!e.repeat) trein.act(); return; } if(e.key==='Escape'){ trein.leave(); return; } }
  const d={ArrowLeft:[-2,0],ArrowRight:[2,0],ArrowUp:[0,-2],ArrowDown:[0,2]}[e.key]; if(d){ e.preventDefault(); trein.panBy(d[0],d[1]); } });
window.addEventListener('keyup',e=>{ const k=KEY[e.key]; if(k&&keys.delete(k)&&trein.driving) keyStick(); });

/* ---------- loop ---------- */
function resize(){ fitBar(); renderer.setSize(app.clientWidth||1,app.clientHeight||1,false); applyCamera(); }
if(window.ResizeObserver) new ResizeObserver(resize).observe(app); window.addEventListener('resize',resize);
let lastT=performance.now();
function loop(now){ const dt=Math.min(.05,Math.max(0,(now-lastT)/1000)); lastT=now; Tm+=dt;
  stepAnim(dt); trein.update(dt,Tm);
  sunG.rotation.z+=dt*.15*AMP; for(const c of clouds){ c.g.position.x+=c.v*dt*AMP; if(c.g.position.x>24) c.g.position.x=-24; }
  stepConf(dt); setCam(); renderer.render(scene,camera); requestAnimationFrame(loop); }
trein.enter(); resize(); requestAnimationFrame(loop);
})();
</script>
