<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treinbaan">
<meta name="theme-color" content="#58c6ff">
<style>html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Treinbaan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap">
<style>
/* Layout: one full-screen 3D play mat; chunky round candy buttons sit in the top corners and along the bottom edge. */
:root{
  --sky-top:#58c6ff; --sky-low:#dcf8ff; --grass:#74d95c;
  --ink:#2a2157; --paper:#fffdf6; --shade:rgba(42,33,87,.28);
  --red:#ff4d5a; --orange:#ff9a1f; --yellow:#ffd22e; --green:#2fc866;
  --blue:#2f9bff; --purple:#9b63ff; --pink:#ff6fc2; --brown:#a8683a;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --btn:clamp(46px,12.5vmin,76px);
  --sw:clamp(34px,9.6vmin,64px);
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--sky-top),var(--sky-low) 72%);color:var(--ink);font-family:var(--display);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

.bar{position:absolute;left:16px;right:16px;display:flex;gap:8px;pointer-events:none}
.bar.top{top:12px;justify-content:space-between;align-items:flex-start}
.bar.bottom{bottom:16px;justify-content:center}
.grp{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.btn,.sw{pointer-events:auto;flex:none;border-radius:50%;border:4px solid var(--paper);background:var(--c,var(--blue));color:var(--i,var(--paper));display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 6px 0 var(--shade);transition:transform .12s,box-shadow .12s,border-color .12s;touch-action:manipulation}
.btn{width:var(--btn);height:var(--btn)}
.sw{width:var(--sw);height:var(--sw)}
.btn:active,.sw:active{transform:translateY(4px) scale(.95);box-shadow:0 2px 0 var(--shade)}
.btn:focus-visible,.sw:focus-visible,.lab:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.btn svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn.face{background:var(--paper)}
.btn.face svg{width:80%;height:80%;stroke:none}
.btn.on,.sw.on{border-color:var(--ink);transform:translateY(-6px) scale(1.14)}
.grp.col{flex-direction:column;gap:8px}
.sw svg{width:66%;height:66%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn.big{width:calc(var(--btn)*1.25);height:calc(var(--btn)*1.25)}
.btn.ready{animation:klaar .9s ease-in-out infinite}
@keyframes klaar{50%{transform:scale(1.18)}}

#fail{position:absolute;inset:0;margin:0;display:grid;place-items:center;padding:24px;text-align:center;font:700 20px/1.4 var(--display);background:var(--paper);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.btn.ready{animation:none}.btn,.sw{transition:none}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Speelmat"></canvas>
  <div class="bar top"><div class="grp" id="tl"></div><div class="grp" id="tr"></div></div>
  <div class="bar bottom" id="bot"></div>
  <p id="fail" hidden>Dit spel heeft 3D nodig. Open het in een nieuwere browser.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const app=$('#app'), canvas=$('#c');
const T=window.THREE;
let renderer=null;
if(T){ try{ renderer=new T.WebGLRenderer({canvas,antialias:true,alpha:true}); }catch(e){ renderer=null; } }
if(!renderer){ $('#fail').hidden=false; return; }

const V3=T.Vector3, YAX=new V3(0,1,0), PI=Math.PI;
const R=(a,b)=>a+Math.random()*(b-a);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, AMP=reduce?0:1;
const C={red:0xff4d5a,orange:0xff9a1f,yellow:0xffd22e,green:0x2fc866,blue:0x2f9bff,purple:0x9b63ff,pink:0xff6fc2,brown:0xa8683a,ink:0x2a2157,paper:0xfffdf6,grass:0x74d95c,wood:0xf2c078};
const RAINBOW=[C.red,C.orange,C.yellow,C.green,C.blue,C.purple];
const hx=c=>'#'+c.toString(16).padStart(6,'0');

/* ---------- geometry + material helpers ---------- */
const mat=(c,o)=>new T.MeshPhongMaterial(Object.assign({color:c,shininess:40,specular:0x222222},o||{}));
const sph=(r,w=20,h=14)=>new T.SphereGeometry(r,w,h);
const cyl=(a,b,h,s=20)=>new T.CylinderGeometry(a,b,h,s);
const cone=(r,h,s=20)=>new T.ConeGeometry(r,h,s);
const box=(w,h,d)=>new T.BoxGeometry(w,h,d);
const torus=(Rr,r,arc=PI*2,ts=10,rs=32)=>new T.TorusGeometry(Rr,r,ts,rs,arc);
function mesh(geo,m,x=0,y=0,z=0,parent){ const o=new T.Mesh(geo,m); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; if(parent) parent.add(o); return o; }
function rrShape(w,h,r){ const s=new T.Shape(),x=-w/2,y=-h/2; s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r); s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h); s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r); s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y); return s; }
function roundBox(w,h,d,r=.12,b=.06){ const g=new T.ExtrudeGeometry(rrShape(w-2*b,h-2*b,r),{depth:d-2*b,bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:6}); g.translate(0,0,-(d-2*b)/2); return g; }
function pyramid(r,h){ const g=new T.ConeGeometry(r,h,4).toNonIndexed(); g.rotateY(PI/4); g.computeVertexNormals(); return g; }
function starGeo(Ro=.55,ri=.25,d=.16){ const s=new T.Shape(); for(let i=0;i<10;i++){ const a=i/10*PI*2+PI/2,q=i%2?ri:Ro,x=Math.cos(a)*q,y=Math.sin(a)*q; if(i) s.lineTo(x,y); else s.moveTo(x,y); } s.closePath(); const g=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:2}); g.center(); return g; }
function canvasTex(draw,rx=1,ry=1){ const c=document.createElement('canvas'); c.width=c.height=256; draw(c.getContext('2d')); const t=new T.CanvasTexture(c); t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rx,ry); return t; }

/* ---------- tweens + timers ---------- */
const ease={ lin:k=>k, out:k=>1-Math.pow(1-k,3), inOut:k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,
  back:k=>{const c=1.70158;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);},
  bounce:k=>{const n=7.5625,d=2.75; if(k<1/d)return n*k*k; if(k<2/d)return n*(k-=1.5/d)*k+.75; if(k<2.5/d)return n*(k-=2.25/d)*k+.9375; return n*(k-=2.625/d)*k+.984375;} };
let tweens=[], timers=[], Tm=0;
function tw(dur,fn,e,done){ tweens.push({t:0,dur,fn,e:e||ease.out,done}); }
function after(sec,fn){ timers.push({t:sec,fn}); }
function stepAnim(dt){
  for(const a of tweens.slice()){ a.t+=dt; const k=Math.min(1,a.t/a.dur); a.fn(a.e(k),k); if(k>=1){ a.dead=true; if(a.done) a.done(); } }
  tweens=tweens.filter(a=>!a.dead);
  for(const a of timers.slice()){ a.t-=dt; if(a.t<=0){ a.dead=true; a.fn(); } }
  timers=timers.filter(a=>!a.dead);
}
function pop(o,amp=.22,dur=.32){ const s=o.userData.s0||(o.userData.s0=o.scale.clone()); tw(dur,(e,k)=>{ o.scale.copy(s).multiplyScalar(1+amp*Math.sin(k*PI)); },ease.lin); }
function popIn(o,dur=.4){ const s=o.userData.s0||(o.userData.s0=o.scale.clone()); tw(dur,e=>{ o.scale.copy(s).multiplyScalar(Math.max(.001,e)); },ease.back); }

/* ---------- sound ---------- */
let actx=null, muted=false;
try{ muted=localStorage.getItem('treinbaan-stil')==='1'; }catch(e){}
function audio(){ if(!actx){ const A=window.AudioContext||window.webkitAudioContext; if(A){ try{ actx=new A(); }catch(e){} } } if(actx&&actx.state==='suspended'){ const p=actx.resume(); if(p&&p.catch) p.catch(()=>{}); } return actx; }
function tone(f,dur=.15,type='sine',vol=.2,f2=0,delay=0){
  if(muted) return; const a=audio(); if(!a) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.05);
}
const NOTE=[262,294,330,349,392,440,494,523,587,659];
const sfx={
  pop:i=>{ const n=NOTE[(i||0)%NOTE.length]; tone(n*2,.12,'triangle',.2,n*3); },
  note:i=>tone(NOTE[(i||0)%NOTE.length],.35,'triangle',.24),
  plop:()=>tone(220,.16,'sine',.3,90),
  boing:()=>tone(180,.3,'sine',.25,430),
  boop:()=>tone(300,.14,'sine',.18,240),
  tap:()=>tone(520,.08,'sine',.15,720),
  tada:()=>[0,2,4,7].forEach((n,i)=>tone(NOTE[n]*2,.42,'triangle',.2,0,i*.11)),
  crash:()=>{ for(let i=0;i<6;i++) tone(R(120,320),.25,'square',.05,60,i*.04); }
};

/* ---------- world ---------- */
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();
const camera=new T.PerspectiveCamera(35,1,.1,300);
scene.add(new T.HemisphereLight(0xffffff,0xdcf3d2,.66));
const sunL=new T.DirectionalLight(0xffffff,.5); sunL.position.set(7,14,9); sunL.castShadow=true;
sunL.shadow.mapSize.set(1024,1024); sunL.shadow.bias=-.0006; sunL.shadow.normalBias=.03; sunL.shadow.radius=3;
{ const s=sunL.shadow.camera; s.left=-10; s.right=10; s.top=10; s.bottom=-10; s.near=1; s.far=45; }
scene.add(sunL);
const ground=new T.Mesh(new T.SphereGeometry(90,64,32),new T.MeshLambertMaterial({color:C.grass})); ground.position.y=-90; ground.receiveShadow=true; scene.add(ground);

const decor=new T.Group(); scene.add(decor);
const sunG=new T.Group(); sunG.position.set(-5,13,-24); decor.add(sunG);
{ const sm=new T.MeshBasicMaterial({color:0xffe14a}); sunG.add(new T.Mesh(sph(1.7,24,16),sm));
  for(let i=0;i<10;i++){ const a=i/10*PI*2, r=new T.Mesh(cone(.34,.9,8),sm); r.position.set(Math.cos(a)*2.5,Math.sin(a)*2.5,0); r.rotation.z=a-PI/2; sunG.add(r); } }
const clouds=[];
{ const cm=new T.MeshLambertMaterial({color:0xffffff,emissive:0x8a8a8a});
  [[-9,9.5,-16,.2],[6,11.5,-20,.14],[13,8,-18,.24],[-15,12.5,-24,.17],[1,14.5,-26,.11]].forEach(([x,y,z,v])=>{ const g=new T.Group(); g.position.set(x,y,z);
    [[0,0,0,1.2],[1.2,-.1,0,.9],[-1.2,-.15,0,.85],[.4,.55,-.2,.8]].forEach(([a,b,c,r])=>{ const m=new T.Mesh(sph(r,14,10),cm); m.position.set(a,b,c); g.add(m); });
    decor.add(g); clouds.push({g,v}); }); }
{ const trunk=mat(C.brown), leaf=[mat(0x3dbb5e),mat(0x58cf52),mat(0x2faf78)];
  [[-8,-7,1],[8.5,-9,1.25],[-12.5,-13,1.4],[12.5,-15,1.1],[-4.5,-14,.9]].forEach(([x,z,s],i)=>{ const g=new T.Group(); g.position.set(x,-(x*x+z*z)/180,z); g.scale.setScalar(s);
    mesh(cyl(.22,.3,1.6,10),trunk,0,.8,0,g); mesh(sph(1.15,16,12),leaf[i%3],0,2.3,0,g); decor.add(g); });
  let seed=7; const rs=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const fl=RAINBOW.concat([C.pink,C.paper]).map(c=>new T.MeshLambertMaterial({color:c}));
  for(let i=0;i<34;i++){ const a=PI*(.08+rs()*.84)+PI, r=9.5+rs()*12, x=Math.cos(a)*r, z=Math.sin(a)*r+1; const m=new T.Mesh(sph(.16,8,6),fl[i%fl.length]); m.position.set(x,-(x*x+z*z)/180+.12,z); decor.add(m); } }

/* ---------- confetti ---------- */
const conf=[], confGeo=box(.17,.17,.04), basicCache={};
const basic=c=>basicCache[c]||(basicCache[c]=new T.MeshBasicMaterial({color:c}));
const confCols=RAINBOW.concat([C.pink]);
for(let i=0;i<120;i++){ const m=new T.Mesh(confGeo,basic(C.red)); m.visible=false; scene.add(m); conf.push({m,v:new V3(),w:new V3(),life:0}); }
let confI=0;
function burst(p,n=24,power=5,color){ for(let i=0;i<n;i++){ const c=conf[confI++%conf.length]; c.m.visible=true; c.m.position.copy(p); c.m.material=basic(color!=null?color:confCols[(Math.random()*confCols.length)|0]); c.v.set(R(-.5,.5)*power,R(.4,1.5)*power,R(-.5,.5)*power); c.w.set(R(-9,9),R(-9,9),R(-9,9)); c.life=R(1.2,2); c.m.userData.s=R(.8,1.6); c.m.scale.setScalar(c.m.userData.s); } }
function stepConf(dt){ for(const c of conf){ if(c.life<=0) continue; c.life-=dt; if(c.life<=0){ c.m.visible=false; continue; } c.v.y-=9*dt; c.m.position.addScaledVector(c.v,dt); c.m.rotation.x+=c.w.x*dt; c.m.rotation.y+=c.w.y*dt; c.m.rotation.z+=c.w.z*dt; c.m.scale.setScalar(c.m.userData.s*Math.min(1,c.life/.3)); } }

/* ---------- picking ---------- */
const ray=new T.Raycaster(), ndc=new T.Vector2();
function hit(ev,list,rec){ const r=canvas.getBoundingClientRect(); ndc.set((ev.clientX-r.left)/r.width*2-1,-((ev.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera); const h=ray.intersectObjects(list,!!rec); hit.all=h; return h[0]||null; }

/* ---------- building blocks ---------- */
const BLOK=(()=>{
  const PH=window.CANNON, HALF=.47, RH=.82, V=(x,y,z)=>new PH.Vec3(x,y,z);
  const ext=s=>new T.ExtrudeGeometry(s,{depth:.84,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:2,curveSegments:10});
  const fit=(q,w,h)=>{ q.center(); q.computeBoundingBox(); const b=q.boundingBox; q.scale(w/(b.max.x-b.min.x),h/(b.max.y-b.min.y),.94/(b.max.z-b.min.z)); return q; };
  const geos={ kubus:roundBox(.94,.94,.94,.1,.05), cilinder:cyl(HALF,HALF,.94,28),
    dak:(()=>{ const s=new T.Shape(); s.moveTo(-.42,0); s.lineTo(.42,0); s.lineTo(0,.72); s.closePath(); const q=fit(ext(s),.94,RH); q.translate(0,RH/6,0); return q; })(),
    boog:(()=>{ const s=new T.Shape(); s.moveTo(-.42,-.42); s.lineTo(-.24,-.42); s.absarc(0,-.42,.24,PI,0,true); s.lineTo(.42,-.42); s.lineTo(.42,.42); s.lineTo(-.42,.42); s.closePath(); return fit(ext(s),.94,.94); })(),
    plat:roundBox(2.94,.3,.94,.1,.05) };
  const cylQ=PH?new PH.Quaternion():null; if(cylQ) cylQ.setFromAxisAngle(V(1,0,0),-PI/2);
  const shapes={
    kubus:b=>b.addShape(new PH.Box(V(HALF,HALF,HALF))),
    cilinder:b=>b.addShape(new PH.Cylinder(HALF,HALF,.94,14),V(0,0,0),cylQ),
    boog:b=>{ b.addShape(new PH.Box(V(.47,.335,.47)),V(0,.135,0)); [-1,1].forEach(s=>b.addShape(new PH.Box(V(.115,.135,.47)),V(s*.355,-.335,0))); },
    dak:b=>{ const w=HALF,bt=RH/3,tp=RH*2/3,d=HALF; b.addShape(new PH.ConvexPolyhedron([V(-w,-bt,d),V(w,-bt,d),V(0,tp,d),V(-w,-bt,-d),V(w,-bt,-d),V(0,tp,-d)],[[0,1,2],[3,5,4],[0,3,4,1],[1,4,5,2],[0,2,5,3]])); },
    plat:b=>b.addShape(new PH.Box(V(1.47,.15,HALF)))
  };
  return {PH,HALF,RH,V,geos,shapes,bottom:{kubus:HALF,cilinder:HALF,boog:HALF,dak:RH/3,plat:.15},cols:RAINBOW.concat([C.pink])};
})();

/* ---------- wooden railway: track pieces and little trains ---------- */
const SPOOR=(()=>{
  /* every piece starts at its end A (the origin) heading along +x; a bend turns left, a bridge piece climbs one level in a gentle S */
  const RR=2, TH=.16, HW=.45, RISE=1.1, BL=4, ARCH=.72, N=24;
  const wood=mat(C.wood,{shininess:14,specular:0x111111}), beech=mat(0xe2ab66,{shininess:10,specular:0x0c0c0c}), grv=new T.MeshLambertMaterial({color:0xc48a47}), ink=mat(C.ink), yel=mat(C.yellow), glass=mat(0xbfe6ff);
  const rise=x=>{ const u=Math.max(0,Math.min(1,x/BL)); return RISE*u*u*(3-2*u); };
  const lay=q=>{ q.rotateX(-PI/2); return q; };
  const arc=(r0,r1)=>{ const s=new T.Shape(), e=.012; s.absarc(0,RR,r1,-PI/2+e,-e,false); s.absarc(0,RR,r0,-e,-PI/2+e,true); s.closePath(); return s; };
  const side=pts=>{ const s=new T.Shape(); pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); s.closePath(); return s; };
  const slab=(s,d)=>{ const q=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}); q.translate(0,0,-d/2); return q; };
  const round=(cx,cy,a0,a1)=>{ const o=[]; for(let i=0;i<=6;i++){ const a=a0+(a1-a0)*i/6; o.push([cx+Math.cos(a)*.3,cy+Math.sin(a)*.3]); } return o; };
  const along=(x0,x1,dy)=>{ const o=[]; for(let i=0;i<=N;i++){ const x=x0+(x1-x0)*i/N; o.push([x,rise(x)+dy]); } return o; };
  const geo={
    recht:(()=>{ const q=lay(roundBox(1.97,2*HW,TH,.08,.025)); q.translate(1,TH/2,0); return q; })(),
    bocht:(()=>{ const q=lay(new T.ExtrudeGeometry(arc(RR-HW+.025,RR+HW-.025),{depth:TH-.05,bevelEnabled:true,bevelThickness:.025,bevelSize:.025,bevelSegments:2,curveSegments:18})); q.translate(0,.025,0); return q; })(),
    brug:slab(side(along(.015,BL-.015,TH).concat(along(BL-.015,.015,0))),2*HW),
    /* what the bridge stands on: solid wood under the slope, and half an arch at the high end */
    romp:slab(side([[.5,0],[BL-ARCH,0]].concat(round(BL-ARCH+.3,RISE-.42,PI,PI/2),[[BL-.015,RISE-.12]],along(BL-.015,.5,-.004))),.84),
    /* under a high straight piece: a pillar that opens into half an arch on both sides, so two neighbours make a whole arch over their joint */
    pijler:slab(side([[ARCH,-RISE],[2-ARCH,-RISE]].concat(round(2-ARCH+.3,-.42,PI,PI/2),[[1.985,-.12],[1.985,0],[.015,0],[.015,-.12]],round(ARCH-.3,-.42,PI/2,0))),.84),
    zuil:roundBox(.56,RISE,.84,.12,.04),
    gRecht:box(1.97,.012,.1), gBrug:slab(side(along(.015,BL-.015,TH+.003).concat(along(BL-.015,.015,TH+.015))),.1),
    gBocht:[-.24,.24].map(o=>{ const q=lay(new T.ShapeGeometry(arc(RR+o-.05,RR+o+.05),18)); q.translate(0,TH+.006,0); return q; })
  };
  const LEN={recht:2,bocht:PI*RR/2,brug:(()=>{ let l=0; for(let i=0;i<64;i++){ const a=BL*i/64, b=BL*(i+1)/64; l+=Math.hypot(b-a,rise(b)-rise(a)); } return l; })()};
  /* where end B is (in grid steps and levels) and how many quarter turns the heading has made there */
  const END={recht:{b:[2,0,0],oq:0},bocht:{b:[RR,0,-RR],oq:1},brug:{b:[BL,1,0],oq:0}};

      ptr={id:ev.pointerId,x0:ev.clientX,y0:ev.clientY,t0:now,lx:ev.clientX,ly:ev.clientY,lt:now,rec,kind,pt:h?h.point.clone():null,mode:0}; },
    move(ev){ if(!ptr||ev.pointerId!==ptr.id) return;
      if(!ptr.mode){ const dx=ev.clientX-ptr.x0, dy=ev.clientY-ptr.y0; if(dx*dx+dy*dy<100) return; ptr.mode=ptr.kind==='v'||ptr.kind==='p'||(ptr.kind==='b'&&performance.now()-ptr.t0>=70)?1:2; if(ptr.mode===1) grab(ptr.rec); }
      if(ptr.mode===1) aim(ev); else if(world) push(ev); },
    up(ev){ if(!ptr||(ev&&ev.pointerId!==ptr.id)) return; const p=ptr; if(p.mode===1){ ptr=null; release(); return; }
      if(!p.mode){ if(p.kind==='v'){ pop(p.rec.g,.25); if(p.rec.loco) toot(); else sfx.tap(); } else if(tab==='blok') tapBlock(); else if(p.kind==='p'){ pop(p.rec.g,.06); sfx.tap(); } else if(p.kind==='b'){ pop(p.rec.m,.12); sfx.tap(); } }
      ptr=null; }
  };
})();

/* ---------- camera ---------- */
const cur='trein'; let camAngle=0;
const camT=new V3(), camO=new V3(0,0,10), tmpO=new V3();
function setCam(){ tmpO.copy(camO).applyAxisAngle(YAX,camAngle); camera.position.copy(camT).add(tmpO); camera.lookAt(camT); camera.updateMatrixWorld(); }
function applyCamera(){
  const W=app.clientWidth||1,H=app.clientHeight||1,a=W/H; camera.aspect=a; camera.updateProjectionMatrix();
  const f=trein.frame(a), b=Math.max(46,Math.min(76,Math.min(W,H)*.125)), top=b+26, bottom=f.bottom!=null?f.bottom:b+36;
  const usable=Math.max(.4,(H-top-bottom)/H), th=Math.tan(camera.fov*PI/360);
  const d=Math.max(f.h/2/(th*usable),f.w/2/(th*a*.94));
  const dir=new V3(f.dir[0],f.dir[1],f.dir[2]).normalize(), right=new V3().crossVectors(YAX,dir).normalize(), up=new V3().crossVectors(dir,right);
  camT.set(f.c[0],f.c[1],f.c[2]).addScaledVector(up,(top-bottom)/2*(2*d*th/H));
  camO.copy(dir).multiplyScalar(d); setCam();
}

  cilinder:'<ellipse cx="12" cy="6.5" rx="7" ry="3"/><path d="M5 6.5v11c0 1.7 3.1 3 7 3s7-1.3 7-3v-11"/>',

};

function mkBtn(parent,o){ const b=document.createElement('button'); b.type='button'; b.id=o.id; b.className=o.cls||'btn'; if(o.c) b.style.setProperty('--c',o.c); if(o.i) b.style.setProperty('--i',o.i); b.setAttribute('aria-label',o.label); b.title=o.label; if(o.svg||o.icon) b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+(o.svg||ICON[o.icon])+'</svg>'; b.addEventListener('click',()=>{ audio(); o.on(b); }); parent.appendChild(b); return b; }
function choose(list,b){ list.forEach(x=>x.classList.toggle('on',x===b)); }
const tl=$('#tl'), tr=$('#tr'), bot=$('#bot');
mkBtn(tl,{id:'bSound',icon:muted?'mute':'sound',c:'var(--purple)',label:'Geluid aan of uit',on:b=>{ muted=!muted; try{ localStorage.setItem('treinbaan-stil',muted?'1':'0'); }catch(e){} b.querySelector('svg').innerHTML=ICON[muted?'mute':'sound']; sfx.tap(); }});
{ mkBtn(tr,{id:'trReset',icon:'reset',c:'var(--orange)',label:'Alles weg, opnieuw beginnen',on:()=>trein.reset()});
  /* two tabs: one with rails and trains, one with building blocks; on a narrow screen the tabs sit on their own row above the buttons */
  const p=document.createElement('div'), tabs=document.createElement('div'), gR=document.createElement('div'), gB=document.createElement('div'), tb=[], bs=[]; p.id='treinBar'; p.className='grp'; p.style.columnGap='18px'; bot.appendChild(p);
  [tabs,gR,gB].forEach(d=>{ d.className='grp'; d.style.flex='none'; p.appendChild(d); }); gB.hidden=true;
  const ST={recht:'<rect x="3" y="7.500" width="18" height="9" rx="1.500"/><path d="M3 10.500h18M3 13.500h18" stroke-width="1.200"/>',
    bocht:'<path d="M4 21A17 17 0 0 1 21 4v8a9 9 0 0 0-9 9z"/>', brug:'<path d="M2.500 19c5.500 0 6.500-9 12.500-9h6.500v9z"/><path d="M15.500 19v-3a2 2 0 0 1 4 0v3"/>', plat:'<rect x="2.500" y="9" width="19" height="6" rx="1.500"/>'};
  const tabTo=(t,b)=>{ gR.hidden=t!=='rails'; gB.hidden=t!=='blok'; choose(tb,b); trein.setTab(t); };
  tb.push(mkBtn(tabs,{id:'tab-rails',cls:'sw',svg:ST.recht,c:'#f2c078',i:'var(--ink)',label:'Rails en treinen',on:b=>tabTo('rails',b)}),mkBtn(tabs,{id:'tab-blok',cls:'sw',icon:'kubus',c:'var(--red)',label:'Bouwblokken',on:b=>tabTo('blok',b)})); tb[0].classList.add('on');
  [['recht','Recht stuk'],['bocht','Bocht'],['brug','Brug omhoog of omlaag']].forEach(([k,l])=>mkBtn(gR,{id:'spoor-'+k,svg:ST[k],c:'#f2c078',i:'var(--ink)',label:l,on:()=>trein.add(k)}));
  const wh='<circle cx="8" cy="18" r="2.600" fill="'+ik+'"/><circle cx="16" cy="18" r="2.600" fill="'+ik+'"/>';
  mkBtn(gR,{id:'spoor-loc',cls:'btn face',svg:'<rect x="3" y="4.500" width="9" height="2" rx="1" fill="#ffd22e"/><rect x="4" y="6" width="7" height="11" rx="1.500" fill="#ff4d5a"/><rect x="10" y="10.500" width="10.500" height="6.500" rx="1.500" fill="#ff4d5a"/><rect x="15.500" y="6.500" width="3" height="4.500" rx=".800" fill="'+ik+'"/><rect x="5.800" y="8" width="3.400" height="3" rx=".600" fill="#bfe6ff"/>'+wh,label:'Locomotief',on:()=>trein.addTrain('loc')}).style.marginLeft='10px';
  mkBtn(gR,{id:'spoor-wagon',cls:'btn face',svg:'<circle cx="8.500" cy="7.500" r="2.600" fill="#ffd22e"/><circle cx="14.500" cy="7.500" r="2.600" fill="#ff9a1f"/><rect x="3.500" y="9" width="17" height="8" rx="1.500" fill="#2f9bff"/>'+wh,label:'Wagon',on:()=>trein.addTrain('wagon')});
  [['kubus','var(--red)','Blok'],['cilinder','var(--blue)','Rol'],['dak','var(--orange)','Dak'],['boog','var(--purple)','Boog'],['plat','var(--green)','Plat dak']].forEach(([k,c,l])=>{ bs.push(mkBtn(gB,{id:'tblok-'+k,icon:ST[k]?null:k,svg:ST[k],c,label:l,on:b=>{ trein.setShape(k); choose(bs,b); }})); }); bs[0].classList.add('on'); }

/* ---------- input ---------- */
const downs=new Set();
canvas.addEventListener('pointerdown',ev=>{ audio(); downs.add(ev.pointerId); try{ canvas.setPointerCapture(ev.pointerId); }catch(e){} trein.down(ev); });
canvas.addEventListener('pointermove',ev=>{ if(downs.has(ev.pointerId)) trein.move(ev); });
['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,ev=>{ downs.delete(ev.pointerId); trein.up(ev); }));
canvas.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- loop ---------- */
function resize(){ renderer.setSize(app.clientWidth||1,app.clientHeight||1,false); applyCamera(); }
if(window.ResizeObserver) new ResizeObserver(resize).observe(app); window.addEventListener('resize',resize);
let lastT=performance.now();
function loop(now){ const dt=Math.min(.05,Math.max(0,(now-lastT)/1000)); lastT=now; Tm+=dt;
  stepAnim(dt); trein.update(dt,Tm);
  sunG.rotation.z+=dt*.15*AMP; for(const c of clouds){ c.g.position.x+=c.v*dt*AMP; if(c.g.position.x>24) c.g.position.x=-24; }
  stepConf(dt); setCam(); renderer.render(scene,camera); requestAnimationFrame(loop); }
trein.enter(); resize(); requestAnimationFrame(loop);
})();
